<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircall Team Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --aircall-green: #00BD82;
            --aircall-green-hover: #00A872;
            --bg-light: #F7F8FC;
            --text-dark: #012635;
            --text-grey: #6B7280;
            --white: #ffffff;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --border: #E5E7EB;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg-light); color: var(--text-dark); margin: 0; }
        
        /* Layout Modules */
        .login-wrapper { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .app-container { display: none; padding: 40px 20px; max-width: 1000px; margin: 0 auto; }
        
        .card { background: var(--white); padding: 40px; border-radius: 16px; box-shadow: var(--shadow); width: 100%; max-width: 440px; text-align: center; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; }

        button { width: 100%; padding: 12px; background: var(--aircall-green); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        button:hover { background: var(--aircall-green-hover); }
        button:disabled { background: var(--border); cursor: not-allowed; }

        /* Team & User Lists */
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .team-card { background: var(--white); padding: 24px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; }
        .team-card:hover { border-color: var(--aircall-green); }

        .management-view { display: none; background: var(--white); padding: 30px; border-radius: 16px; box-shadow: var(--shadow); }
        .user-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); }
        .user-item input { width: auto; margin-right: 15px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-link { color: var(--aircall-green); cursor: pointer; font-size: 14px; font-weight: 500; }
    </style>
</head>
<body>

    <div id="loginView" class="login-wrapper">
        <div class="card">
            <h2>Connect to Aircall</h2>
            <div class="input-group"><label>API ID</label><input type="text" id="apiId"></div>
            <div class="input-group"><label>API Token</label><input type="password" id="apiToken"></div>
            <button onclick="handleLogin()">Login</button>
        </div>
    </div>

    <div id="appView" class="app-container">
        <div class="header">
            <h1>Teams</h1>
            <span class="back-link" onclick="handleLogout()">Sign Out</span>
        </div>
        <div id="teamsList" class="team-grid"></div>

        <div id="managementView" class="management-view">
            <div class="header">
                <h2 id="selectedTeamName">Team Management</h2>
                <span class="back-link" onclick="closeManagement()">← Back to Teams</span>
            </div>
            <div id="userList">Loading users...</div>
            <button id="applyBtn" style="margin-top: 20px;" onclick="applyChanges()">Apply Changes</button>
        </div>
    </div>

    <script>
        const baseUrl = "https://api.aircall.io/v1/";
        let currentTeamId = null;
        let originalMembers = new Set();

        function getHeaders() {
            return { 'Authorization': 'Basic ' + btoa(sessionStorage.getItem('ac_id') + ':' + sessionStorage.getItem('ac_token')) };
        }

        async function handleLogin() {
            const id = document.getElementById('apiId').value;
            const token = document.getElementById('apiToken').value;
            sessionStorage.setItem('ac_id', id);
            sessionStorage.setItem('ac_token', token);
            showDashboard();
        }

        function showDashboard() {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('appView').style.display = 'block';
            loadTeams();
        }

        async function loadTeams() {
            const res = await fetch(`${baseUrl}teams`, { headers: getHeaders() });
            const data = await res.json();
            const list = document.getElementById('teamsList');
            list.innerHTML = '';
            data.teams.forEach(team => {
                const div = document.createElement('div');
                div.className = 'team-card';
                div.innerHTML = `<h3>${team.name}</h3><p>${team.users.length} members</p>`;
                div.onclick = () => openTeam(team.id, team.name);
                list.appendChild(div);
            });
        }

        async function openTeam(id, name) {
            currentTeamId = id;
            document.getElementById('teamsList').style.display = 'none';
            document.getElementById('managementView').style.display = 'block';
            document.getElementById('selectedTeamName').innerText = name;
            
            // Fetch all users and current team details
            const [usersRes, teamRes] = await Promise.all([
                fetch(`${baseUrl}users`, { headers: getHeaders() }),
                fetch(`${baseUrl}teams/${id}`, { headers: getHeaders() })
            ]);
            
            const allUsers = (await usersRes.json()).users;
            const teamData = (await teamRes.json()).team;
            originalMembers = new Set(teamData.users.map(u => u.id));

            const list = document.getElementById('userList');
            list.innerHTML = allUsers.map(user => `
                <div class="user-item">
                    <input type="checkbox" data-id="${user.id}" ${originalMembers.has(user.id) ? 'checked' : ''}>
                    <div><strong>${user.name}</strong><br><small>${user.email}</small></div>
                </div>
            `).join('');
        }

        async function applyChanges() {
            const btn = document.getElementById('applyBtn');
            btn.disabled = true;
            btn.innerText = "Processing...";

            const checkboxes = document.querySelectorAll('#userList input');
            for (const cb of checkboxes) {
                const userId = parseInt(cb.dataset.id);
                const isChecked = cb.checked;
                const wasMember = originalMembers.has(userId);

                if (isChecked && !wasMember) {
                    await fetch(`${baseUrl}teams/${currentTeamId}/users/${userId}`, { method: 'POST', headers: getHeaders() });
                } else if (!isChecked && wasMember) {
                    await fetch(`${baseUrl}teams/${currentTeamId}/users/${userId}`, { method: 'DELETE', headers: getHeaders() });
                }
            }

            alert("Changes applied successfully!");
            closeManagement();
        }

        function closeManagement() {
            document.getElementById('managementView').style.display = 'none';
            document.getElementById('teamsList').style.display = 'grid';
            loadTeams();
        }

        function handleLogout() { sessionStorage.clear(); location.reload(); }
        if (sessionStorage.getItem('ac_id')) showDashboard();
    </script>
</body>
</html>
