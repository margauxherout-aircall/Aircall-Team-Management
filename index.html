<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircall Team Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --aircall-green: #00BD82;
            --aircall-green-hover: #00A872;
            --bg-light: #F7F8FC;
            --text-dark: #012635;
            --text-grey: #6B7280;
            --white: #ffffff;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --border: #E5E7EB;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.5;
        }

        /* Login Screen */
        .login-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--white);
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .logo {
            width: 60px;
            margin-bottom: 20px;
        }

        h2 { margin-bottom: 8px; font-weight: 600; }
        .subtitle { color: var(--text-grey); font-size: 14px; margin-bottom: 30px; }

        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--aircall-green);
            box-shadow: 0 0 0 3px rgba(0, 189, 130, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--aircall-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover { background: var(--aircall-green-hover); }

        /* Main App Interface */
        .app-container { display: none; padding: 40px 20px; max-width: 1000px; margin: 0 auto; }
        
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .user-pill {
            background: rgba(0, 189, 130, 0.1);
            color: var(--aircall-green);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .team-card {
            background: var(--white);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .team-card:hover {
            border-color: var(--aircall-green);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05);
        }

        .logout-link {
            color: var(--text-grey);
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
        }

        .error {
            color: #E53E3E;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--aircall-green);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loginView" class="login-wrapper">
        <div class="card">
            <svg class="logo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="20" cy="20" r="20" fill="#00BD82"/>
                <path d="M28 22C28 25.3137 25.3137 28 22 28H14L12 30V22C12 18.6863 14.6863 16 18 16H22C25.3137 16 28 18.6863 28 22Z" fill="white"/>
            </svg>
            <h2>Team Management</h2>
            <p class="subtitle">Connect with your Aircall API credentials</p>
            
            <div class="input-group">
                <label>API ID</label>
                <input type="text" id="apiId" placeholder="Enter your API ID">
            </div>
            <div class="input-group">
                <label>API Token</label>
                <input type="password" id="apiToken" placeholder="Enter your API Token">
            </div>
            
            <div id="loginError" class="error">Invalid credentials. Please try again.</div>
            <button onclick="handleLogin()">Login to Dashboard</button>
        </div>
    </div>

    <div id="appView" class="app-container">
        <div class="nav-bar">
            <div>
                <h1 style="font-size: 24px; font-weight: 600;">Teams</h1>
                <p id="apiDisplay" style="font-size: 13px; color: var(--text-grey);"></p>
            </div>
            <div style="text-align: right;">
                <span class="user-pill">Active Session</span><br>
                <span class="logout-link" onclick="handleLogout()">Sign out</span>
            </div>
        </div>

        <div id="loading" class="loading-spinner"></div>
        <div id="teamsList" class="team-grid"></div>
    </div>

    <script>
        const baseUrl = "https://api.aircall.io/v1/";

        function handleLogin() {
            const id = document.getElementById('apiId').value.trim();
            const token = document.getElementById('apiToken').value.trim();
            const error = document.getElementById('loginError');

            if (!id || !token) {
                error.innerText = "Both fields are required.";
                error.style.display = "block";
                return;
            }

            // Test credentials by fetching teams
            fetch(`${baseUrl}teams`, {
                headers: { 'Authorization': 'Basic ' + btoa(id + ':' + token) }
            })
            .then(res => {
                if (res.ok) {
                    sessionStorage.setItem('ac_id', id);
                    sessionStorage.setItem('ac_token', token);
                    showDashboard();
                } else {
                    throw new Error();
                }
            })
            .catch(() => {
                error.style.display = "block";
            });
        }

        function showDashboard() {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('appView').style.display = 'block';
            document.getElementById('apiDisplay').innerText = `Logged in as: ${sessionStorage.getItem('ac_id')}`;
            loadTeams();
        }

        async function loadTeams() {
            const list = document.getElementById('teamsList');
            const loader = document.getElementById('loading');
            loader.style.display = 'block';
            list.innerHTML = '';

            try {
                const id = sessionStorage.getItem('ac_id');
                const token = sessionStorage.getItem('ac_token');
                
                const response = await fetch(`${baseUrl}teams`, {
                    headers: { 'Authorization': 'Basic ' + btoa(id + ':' + token) }
                });
                const data = await response.json();
                
                data.teams.forEach(team => {
                    const card = document.createElement('div');
                    card.className = 'team-card';
                    card.innerHTML = `
                        <h3 style="margin-bottom: 8px;">${team.name}</h3>
                        <p style="font-size: 13px; color: var(--text-grey);">ID: ${team.id}</p>
                        <p style="font-size: 13px; color: var(--text-grey); margin-top: 10px;">
                            <strong>${team.users.length}</strong> members
                        </p>
                    `;
                    list.appendChild(card);
                });
            } catch (err) {
                console.error(err);
            } finally {
                loader.style.display = 'none';
            }
        }

        function handleLogout() {
            sessionStorage.clear();
            location.reload();
        }

        // Auto-login if session exists
        window.onload = () => {
            if (sessionStorage.getItem('ac_id')) showDashboard();
        }
    </script>
</body>
</html>
