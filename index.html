<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircall Team Management</title>
    <link rel="icon" type="image/png" href="https://aircall.io/favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --aircall-green: #00BD82;
            --aircall-green-hover: #00A872;
            --bg-light: #F7F8FC;
            --text-dark: #012635;
            --text-grey: #6B7280;
            --white: #ffffff;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --border: #E5E7EB;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg-light); color: var(--text-dark); margin: 0; }
        .login-wrapper { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .app-container { display: none; padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--white); padding: 30px; border-radius: 16px; box-shadow: var(--shadow); width: 100%; text-align: center; }
        
        /* Availability Bar */
        .status-dashboard { display: flex; justify-content: space-around; background: var(--white); padding: 20px; border-radius: 12px; margin-bottom: 30px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .status-stat { text-align: center; }
        .status-stat h4 { margin: 0; font-size: 12px; text-transform: uppercase; color: var(--text-grey); letter-spacing: 0.5px; }
        .status-stat span { font-size: 24px; font-weight: 600; display: block; margin-top: 5px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .team-card { background: var(--white); padding: 20px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
        .team-card:hover { border-color: var(--aircall-green); transform: translateY(-2px); }

        .management-container { display: none; gap: 30px; }
        .sidebar { position: sticky; top: 20px; width: 300px; }
        .main-content { flex: 1; background: var(--white); padding: 30px; border-radius: 16px; box-shadow: var(--shadow); }

        .user-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); }
        .status-pill { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; margin-left: 10px; }
        .available { color: #00BD82; background: #E6F9F3; }
        .offline { color: #6B7280; background: #F3F4F6; }
        .dnd { color: #E53E3E; background: #FFF5F5; }

        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 15px; }
        button { padding: 12px 24px; background: var(--aircall-green); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .back-link { color: var(--aircall-green); cursor: pointer; font-size: 14px; font-weight: 500; display: block; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="loginView" class="login-wrapper">
        <div class="card" style="max-width: 400px;">
            <img src="https://aircall.io/favicon-32x32.png" style="width: 32px; margin-bottom: 20px;">
            <h2>Team Manager</h2>
            <input type="text" id="apiId" placeholder="API ID">
            <input type="password" id="apiToken" placeholder="API Token">
            <button onclick="handleLogin()" style="width: 100%;">Connect Dashboard</button>
        </div>
    </div>

    <div id="appView" class="app-container">
        <div class="status-dashboard">
            <div class="status-stat">
                <h4>Available</h4>
                <span id="count-available" style="color: #00BD82;">-</span>
            </div>
            <div class="status-stat">
                <h4>Offline</h4>
                <span id="count-offline" style="color: #6B7280;">-</span>
            </div>
            <div class="status-stat">
                <h4>Do Not Disturb</h4>
                <span id="count-dnd" style="color: #E53E3E;">-</span>
            </div>
        </div>

        <div id="dashboardContent">
            <div class="header">
                <h1>Teams</h1>
                <div>
                    <button onclick="loadData()" style="padding: 8px 16px; font-size: 13px;">Refresh All</button>
                    <a href="#" onclick="handleLogout()" style="margin-left:15px; font-size:13px; color:var(--text-grey);">Sign Out</a>
                </div>
            </div>
            <div id="teamsList" class="team-grid"></div>
        </div>

        <div id="managementView" class="management-container">
            <div class="sidebar">
                <div class="card" style="text-align: left;">
                    <h3 id="selectedTeamName">Team Name</h3>
                    <button id="applyBtn" onclick="applyChanges()" style="width: 100%;">Apply Changes</button>
                    <span class="back-link" onclick="closeManagement()">← Back to Teams</span>
                </div>
            </div>
            <div class="main-content">
                <input type="text" id="userSearch" placeholder="Filter users..." onkeyup="filterUsers()">
                <div id="userList">Loading users...</div>
            </div>
        </div>
    </div>

    <script>
        const baseUrl = "https://api.aircall.io/v1/";
        let currentTeamId = null;
        let originalMembers = new Set();

        function getHeaders() {
            return { 'Authorization': 'Basic ' + btoa(sessionStorage.getItem('ac_id') + ':' + sessionStorage.getItem('ac_token')) };
        }

        function handleLogin() {
            sessionStorage.setItem('ac_id', document.getElementById('apiId').value);
            sessionStorage.setItem('ac_token', document.getElementById('apiToken').value);
            showDashboard();
        }

        function showDashboard() {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('appView').style.display = 'block';
            loadData();
        }

        async function loadData() {
            try {
                // 1. Fetch Global Availability
                const availRes = await fetch(`${baseUrl}users/availabilities`, { headers: getHeaders() });
                const availData = await availRes.json();
                
                let counts = { available: 0, offline: 0, do_not_disturb: 0 };
                availData.users.forEach(u => counts[u.availability] = (counts[u.availability] || 0) + 1);
                
                document.getElementById('count-available').innerText = counts.available;
                document.getElementById('count-offline').innerText = counts.offline;
                document.getElementById('count-dnd').innerText = counts.do_not_disturb;

                // 2. Fetch Teams
                const teamsRes = await fetch(`${baseUrl}teams`, { headers: getHeaders() });
                const teamsData = await teamsRes.json();
                
                const list = document.getElementById('teamsList');
                list.innerHTML = teamsData.teams.map(team => `
                    <div class="team-card" onclick="openTeam('${team.id}', '${team.name}')">
                        <h3>${team.name}</h3>
                        <p style="color:var(--text-grey)">${team.users.length} members</p>
                    </div>`).join('');
            } catch (e) { console.error("Sync error", e); }
        }

        async function openTeam(id, name) {
            currentTeamId = id;
            document.getElementById('dashboardContent').style.display = 'none';
            document.getElementById('managementView').style.display = 'flex';
            document.getElementById('selectedTeamName').innerText = name;
            
            const [uRes, tRes] = await Promise.all([
                fetch(`${baseUrl}users`, { headers: getHeaders() }),
                fetch(`${baseUrl}teams/${id}`, { headers: getHeaders() })
            ]);
            const allUsers = (await uRes.json()).users;
            originalMembers = new Set((await tRes.json()).team.users.map(u => u.id));

            document.getElementById('userList').innerHTML = allUsers.map(u => `
                <div class="user-item" data-search="${u.name.toLowerCase()}">
                    <input type="checkbox" data-id="${u.id}" ${originalMembers.has(u.id) ? 'checked' : ''} style="margin-right:15px;">
                    <div style="flex:1;">
                        <strong>${u.name}</strong> 
                        <span class="status-pill ${u.availability_status}">${u.availability_status}</span>
                    </div>
                </div>`).join('');
        }

        function filterUsers() {
            const val = document.getElementById('userSearch').value.toLowerCase();
            document.querySelectorAll('.user-item').forEach(i => i.style.display = i.dataset.search.includes(val) ? 'flex' : 'none');
        }

        async function applyChanges() {
            const btn = document.getElementById('applyBtn');
            btn.innerText = "Syncing...";
            const checkboxes = document.querySelectorAll('#userList input');
            for (const cb of checkboxes) {
                const id = parseInt(cb.dataset.id);
                if (cb.checked && !originalMembers.has(id)) await fetch(`${baseUrl}teams/${currentTeamId}/users/${id}`, { method: 'POST', headers: getHeaders() });
                else if (!cb.checked && originalMembers.has(id)) await fetch(`${baseUrl}teams/${currentTeamId}/users/${id}`, { method: 'DELETE', headers: getHeaders() });
            }
            alert("Team sync complete!");
            closeManagement();
        }

        function closeManagement() {
            document.getElementById('managementView').style.display = 'none';
            document.getElementById('dashboardContent').style.display = 'block';
            loadData();
        }

        function handleLogout() { sessionStorage.clear(); location.reload(); }
        if (sessionStorage.getItem('ac_id')) showDashboard();
    </script>
</body>
</html>
