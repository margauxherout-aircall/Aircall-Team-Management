<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircall Team Management</title>
    <link rel="icon" type="image/png" href="https://aircall.io/favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* [Same styles as previous turn] */
        #gatekeeperView { height: 100vh; display: flex; align-items: center; justify-content: center; background: #012635; color: white; }
    </style>
</head>
<body>

    <div id="gatekeeperView">
        <div class="card" style="background: #ffffff; color: #012635;">
            <h2>Access Restricted</h2>
            <p style="font-size: 13px; color: #6B7280; margin-bottom: 20px;">Please enter the system password to continue.</p>
            <div class="input-group">
                <input type="password" id="sysPassword" placeholder="System Password">
            </div>
            <button onclick="checkGatekeeper()" style="width: 100%;">Unlock System</button>
            <p id="gateError" style="color: red; font-size: 12px; margin-top: 10px; display: none;">Incorrect password.</p>
        </div>
    </div>

    <div id="loginView" class="login-wrapper" style="display: none;">
        <div class="card">
            <img src="https://aircall.io/favicon-32x32.png" style="width: 32px; margin-bottom: 20px;">
            <h2>Team Manager</h2>
            <div class="input-group"><label>API ID</label><input type="text" id="apiId"></div>
            <div class="input-group"><label>API Token</label><input type="password" id="apiToken"></div>
            <button onclick="handleLogin()" style="width: 100%;">Connect Dashboard</button>
        </div>
    </div>

    <script>
        // Note: For a static site, we simulate the environment variable check.
        // In a full production app, this would be validated by a backend.
        const EXPECTED_HASH = "AircallAdmin2024"; // Replace this with your Railway Var or a Hash

        function checkGatekeeper() {
            const input = document.getElementById('sysPassword').value;
            // In a static Railway build, you can hardcode this or fetch a config file
            if (input === EXPECTED_HASH) {
                document.getElementById('gatekeeperView').style.display = 'none';
                document.getElementById('loginView').style.display = 'flex';
                sessionStorage.setItem('gatekeeper_unlocked', 'true');
            } else {
                document.getElementById('gateError').style.display = 'block';
            }
        }

        // Auto-unlock if session exists
        window.onload = () => {
            if (sessionStorage.getItem('gatekeeper_unlocked') === 'true') {
                document.getElementById('gatekeeperView').style.display = 'none';
                if (sessionStorage.getItem('ac_id')) {
                    showDashboard();
                } else {
                    document.getElementById('loginView').style.display = 'flex';
                }
            }
        }

        /* [Rest of the Aircall logic: loadTeams, openTeam, applyChanges, etc.] */
    </script>
</body>
</html>
