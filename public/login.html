<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Manager — Sign in</title>
  <link rel="icon" type="image/png" href="https://aircall.io/favicon-32x32.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .login-header { text-align: center; margin-bottom: 28px; }
    .login-header img { width: 36px; margin-bottom: 14px; }
    .login-header h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
    .login-header p  { color: var(--text-sub); font-size: 14px; }
    .form-stack { display: flex; flex-direction: column; gap: 16px; }
    .lang-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 24px; }
    .lang-row .lang-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-sub);
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: 0.15s;
    }
    .lang-row .lang-btn:hover { border-color: var(--green); color: var(--green); }
    .lang-row .lang-btn.active { border-color: var(--green); color: var(--green); background: var(--green-light); }
  </style>
</head>
<body>
  <div class="page-centered">
    <div>
      <div class="lang-row" id="langRow"></div>
      <div class="card">
        <div class="login-header">
          <img src="https://aircall.io/favicon-32x32.png" alt="Aircall">
          <h1 data-i18n="login_title">Sign in</h1>
        </div>

        <div id="errorMsg" class="alert alert-error" style="display:none; margin-bottom:16px;"></div>

        <form class="form-stack" id="loginForm">
          <div class="form-group">
            <label class="form-label" for="email" data-i18n="login_email">Email</label>
            <input type="email" id="email" autocomplete="email" required
              data-i18n-placeholder="login_placeholder_email">
          </div>
          <div class="form-group">
            <label class="form-label" for="password" data-i18n="login_password">Password</label>
            <input type="password" id="password" autocomplete="current-password" required
              data-i18n-placeholder="login_placeholder_password">
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
            <span data-i18n="login_submit">Sign in</span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script>
    (async () => {
      await I18n.load();
      renderLangRow();
    })();

    function renderLangRow() {
      const row = document.getElementById('langRow');
      row.innerHTML = I18n.supported.map(l => `
        <button class="lang-btn ${l === I18n.getLang() ? 'active' : ''}" onclick="switchLang('${l}')">
          ${I18n.t('lang_' + l)}
        </button>`).join('');
    }

    async function switchLang(l) {
      await I18n.setLang(l);
      renderLangRow();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span>`;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error === 'Invalid email or password'
            ? I18n.t('login_error_invalid')
            : I18n.t('login_error_generic');
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = `<span data-i18n="login_submit">${I18n.t('login_submit')}</span>`;
          return;
        }
        window.location.href = data.role === 'admin' ? '/admin' : '/';
      } catch {
        errEl.textContent = I18n.t('login_error_generic');
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = `<span data-i18n="login_submit">${I18n.t('login_submit')}</span>`;
      }
    });
  </script>
</body>
</html>
